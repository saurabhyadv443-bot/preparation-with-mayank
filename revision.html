<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Revision Center - Quiz Portal</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/auth.js"></script>
</head>
<body>
  <header class="header">
    <div class="logo-wrap">
      <a href="dashboard.html" class="back-button">← Back</a>
      <div class="logo-badge">Quiz Portal</div>
      <div>
        <div class="brand-title">Revision Center</div>
        <div class="brand-subtitle">Quick revision based on your activity</div>
      </div>
    </div>
    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="prevyear.html">PYQ Explorer</a>
      <a href="search.html">Search</a>
    </nav>
  </header>

  <main class="dashboard-shell">
    <section class="panel saved-library-panel">
      <div class="saved-library-header">
        <div>
          <h2>Saved for Revision</h2>
          <p>Organized by subject and chapter for focused review.</p>
        </div>
        <button id="savedLibraryBack" class="btn btn-tertiary btn-small" type="button" hidden>← Back</button>
      </div>
      <div class="saved-library-tools">
        <input id="savedLibrarySearch" class="search-input" type="search" placeholder="Search saved questions..." aria-label="Search saved questions" />
        <select id="savedLibrarySubject" aria-label="Filter saved questions by subject"><option value="">All Subjects</option></select>
        <select id="savedLibraryChapter" aria-label="Filter saved questions by chapter"><option value="">All Chapters</option></select>
      </div>
      <div id="savedLibraryBreadcrumb" class="saved-library-breadcrumb">Saved for Revision</div>
      <div id="savedLibraryContent">Loading...</div>
    </section>

  </main>

  <footer class="footer">© 2026 Quiz Portal — Designed & Developed by Mayank</footer>
  <script src="assets/js/revision.js"></script>
</body>
</html>
