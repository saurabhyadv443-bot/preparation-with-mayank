<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subject</title>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=collections-subject-hub-20261016" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <script src="assets/js/collectionMigrationBackup.js?v=collection-migration-backup-v2"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</head>
<body>
    <header class="header">
        <div class="logo-wrap">
            <a href="dashboard.html" class="back-button">← Back</a>
            <div class="logo-badge">Quiz Portal</div>
            <div>
                <div class="brand-title" id="subjectTitle">Subject</div>
                <div class="brand-subtitle">Revision hub and performance tracker</div>
            </div>
        </div>
        <nav class="top-nav">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="result.html">Results</a>
            <a href="#" id="logoutBtn" class="btn-tertiary">Logout</a>
        </nav>
    </header>

    <main class="subject-shell">
        <section class="panel subject-panel">
            <div class="section-heading compact-heading subject-heading-row">
                <h2 id="sectionHeading">Chapter Wise Practice</h2>
                <div class="subject-heading-actions">
                    <button id="subjectReviewBtn" class="btn btn-secondary btn-small subject-review-btn" type="button" hidden>Review</button>
                    <button id="collectionBackupToggle" class="btn btn-secondary btn-small" type="button" aria-expanded="false" aria-controls="collectionTools" hidden>Backup &amp; Restore</button>
                </div>
            </div>
            <div id="classificationRemovalControls" class="classification-removal-controls" hidden></div>
            <div id="collectionTools" class="collection-tools" hidden>
                <div class="collection-backup-panel">
                    <div class="collection-backup-actions">
                        <button type="button" class="btn btn-secondary btn-small" data-collection-export-all>Export Backup</button>
                        <button type="button" class="btn btn-secondary btn-small" data-collection-import-button>Import and Merge Backup</button>
                        <input type="file" accept="application/json,.json" data-collection-import-file hidden aria-label="Choose a collection backup file">
                    </div>
                </div>
                <p data-collection-backup-status class="collection-storage-status" role="status" aria-live="polite"></p>
                <p id="collectionMigrationReport" class="collection-storage-status" role="status" aria-live="polite"></p>
                <div class="collection-backup-actions">
                    <button type="button" class="btn btn-secondary btn-small" id="downloadMigrationBackupBtn">Download Migration Backup</button>
                    <button type="button" class="btn btn-secondary btn-small" id="retryCollectionMigrationBtn" hidden>Retry Migration</button>
                    <button type="button" class="btn btn-secondary btn-small" data-legacy-backup-import-button>Import Legacy Browser Backup</button>
                    <input type="file" accept="application/json,.json" data-legacy-backup-import-file hidden aria-label="Choose a legacy browser backup">
                </div>
                <p data-legacy-backup-import-status class="collection-storage-status" role="status" aria-live="polite"></p>
            </div>
            <div id="chapterList" class="chapter-list subject-chapter-list" aria-live="polite"></div>
        </section>
    </main>

    <script src="assets/js/classificationRemoval.js?v=collections-20261016"></script>
    <script src="assets/js/attemptHistoryStore.js"></script>
    <script src="assets/js/collectionStore.js?v=collections-reader-c-20261016"></script>
    <script src="assets/js/subject.js?v=collections-subject-hub-b-20261016"></script>
</body>
</html>
