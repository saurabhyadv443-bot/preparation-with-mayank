<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Change Password - Quiz Portal</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/auth.js"></script>
  <style>
    html,body{height:100%;}
    body.change-pw{background-color:#061224;margin:0;font-family:inherit}
    .bg{position:fixed;inset:0;background-image:url('assets/images/login-bg.jpeg');background-size:cover;background-position:center;z-index:0}
    .overlay{position:fixed;inset:0;background:rgba(2,6,23,0.56);backdrop-filter:blur(4px);z-index:1}
    .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;z-index:2}
    .card{width:100%;max-width:520px;padding:22px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));box-shadow:0 14px 40px rgba(2,6,23,0.6);}
    h2{color:white;margin-bottom:6px}
    p.lead{color:#cbd5e1;margin-bottom:12px}
    .form-row{display:grid;gap:10px;margin-top:8px}
    .form-row input{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:white}
    .actions{display:flex;gap:10px;margin-top:12px}
    .msg{display:none;padding:10px;border-radius:8px;margin-top:8px}
    .msg.show{display:block}
    .msg.success{background:rgba(16,185,129,0.08);color:#bbf7d0}
    .msg.error{background:rgba(239,68,68,0.08);color:#fecaca}
  </style>
</head>
<body class="change-pw">
  <div class="bg" aria-hidden></div>
  <div class="overlay" aria-hidden></div>
  <div class="center">
    <div class="card glass-card">
      <h2>Change Password</h2>
      <p class="lead">Securely update your Quiz Portal password.</p>
      <div class="form-row">
        <input id="verificationCode" type="text" placeholder="Verification Code" />
        <input id="newPw" type="password" placeholder="New Password (min 8 chars)" />
        <input id="confirmPw" type="password" placeholder="Confirm New Password" />
      </div>
      <div class="actions">
        <button id="changeBtn" type="button" class="btn btn-primary">Change Password</button>
        <button id="cancelBtn" type="button" class="btn btn-secondary">Cancel</button>
      </div>
      <div id="msg" class="msg" aria-live="polite"></div>
    </div>
  </div>

  <script>
    (function(){
      const auth = window.auth;
      const codeEl = document.getElementById('verificationCode');
      const newEl = document.getElementById('newPw');
      const confEl = document.getElementById('confirmPw');
      const btn = document.getElementById('changeBtn');
      const cancel = document.getElementById('cancelBtn');
      const msg = document.getElementById('msg');

      function showMsg(text, type){
        msg.textContent = text;
        msg.className = 'msg show ' + (type === 'success' ? 'success' : 'error');
      }

      btn.addEventListener('click', function(event){
        event.preventDefault();
        const code = (codeEl.value || '').trim();
        const newPw = (newEl.value || '').trim();
        const confirmPw = (confEl.value || '').trim();

        msg.className = 'msg';

        const result = window.auth.changePassword(code, newPw, confirmPw);
        const success = result && result.success === true;
        const message = result && result.message ? result.message : 'Unable to change password.';

        showMsg(message, success ? 'success' : 'error');

        if(success){
          setTimeout(function(){
            window.location.href = 'index.html';
          }, 2000);
        }
      });

      cancel.addEventListener('click', function(event){
        event.preventDefault();
        window.location.href = 'index.html';
      });
    })();
  </script>
</body>
</html>
