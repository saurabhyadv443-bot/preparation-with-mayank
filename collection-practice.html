<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection Practice - Quiz Portal</title>
    <link rel="stylesheet" href="assets/css/quiz.css" />
    <style>
        .option-btn { display: block; width: 100%; padding: 16px; margin: 12px 0; border: 2px solid #dbe3ee; border-radius: 8px; background: #fff; cursor: pointer; font-size: 1rem; text-align: left; transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { border-color: #155eef; background: #f3f7ff; }
        .option-btn:disabled { cursor: default; opacity: 0.9; }
        .option-btn.correct-option { border-color: #059669; background: #ecfdf5; }
        .option-btn.incorrect-option { border-color: #dc2626; background: #fef2f2; }
        .option-label { display: inline-block; min-width: 30px; font-weight: 600; color: #155eef; margin-right: 12px; }
        .result-correct { padding: 16px; background: #ecfdf5; border-left: 4px solid #059669; border-radius: 4px; color: #047857; font-weight: 600; margin-bottom: 16px; }
        .result-incorrect { padding: 16px; background: #fef2f2; border-left: 4px solid #dc2626; border-radius: 4px; color: #b91c1c; font-weight: 600; margin-bottom: 16px; }
        .result-timeout { padding: 16px; background: #fef3c7; border-left: 4px solid #f59e0b; border-radius: 4px; color: #b45309; font-weight: 600; margin-bottom: 16px; }
        .answer-section, .explanation-section { margin-bottom: 16px; padding: 16px; background: #f9fafb; border-radius: 8px; }
        .correct-option { padding: 8px 12px; background: #ecfdf5; border-left: 3px solid #059669; margin-top: 8px; border-radius: 4px; color: #047857; font-weight: 500; }
        .question-content { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; }
        .question-text { font-size: 1.1rem; font-weight: 500; line-height: 1.6; color: #1f2937; }
        .options-box { margin: 24px 0; }
        .answer-box { margin-top: 24px; padding-top: 16px; border-top: 2px solid #e5e7eb; }
        .navigation { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
    </style>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</head>
<body>
    <header class="topbar">
        <div>
            <div class="topbar-kicker">Practice Mode</div>
            <h1 id="collectionTitle">Collection Practice</h1>
            <div class="logo-badge">Quiz Portal</div>
            <div class="top-right">
                <div id="timer" class="timer-pill">00:40</div>
                <button id="exitBtn" class="btn-danger">✕ Exit</button>
                <button id="logoutBtn" class="btn-tertiary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="practiceSection" class="panel panel-light">
            <div class="section-heading compact-heading">
                <h2 id="questionCounter">Question 1 of 1</h2>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>

            <div id="questionBox" class="question-content"></div>

            <div id="optionsBox" class="options-box"></div>

            <div id="answerBox" class="answer-box" style="display: none;">
                <div id="resultBanner" class="result-banner"></div>
                <div id="correctAnswerBox"></div>
                <div id="explanationBox"></div>
            </div>

            <div class="navigation">
                <button id="nextBtn" class="btn btn-primary" style="display: none;">Next ➜</button>
            </div>
        </section>
    </main>

    <div id="exitConfirmModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-icon">⚠</div>
            <h3>Exit Practice?</h3>
            <p class="modal-copy">Your progress will not be saved.</p>
            <div class="modal-actions">
                <button id="cancelExitBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmExitBtn" class="btn btn-danger">Exit</button>
            </div>
        </div>
    </div>

    <script src="assets/js/collectionPractice.js"></script>
</body>
</html>
