<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPSC Complete Practice Hub</title>
    <style>
        /* ==========================
           RESET
        ========================== */
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
        body { background:#EAF4FF; color:#222; padding:20px; }

        /* ==========================
           FLOATING BUTTONS
        ========================== */
        .back-btn, .home-btn {
            position:fixed; top:15px; width:48px; height:48px; border:none;
            border-radius:50%; background:#1565C0; color:#fff; font-size:22px;
            cursor:pointer; z-index:999; box-shadow:0 5px 12px rgba(0,0,0,.25);
            transition:.3s;
        }
        .back-btn { left:15px; }
        .home-btn { right:15px; }
        .back-btn:hover, .home-btn:hover { background:#0D47A1; transform:scale(1.08); }

        /* ==========================
           QUIZ CONTAINER & HEADER
        ========================== */
        .quiz-container {
            max-width:1000px; margin:70px auto 30px; background:#fff;
            border-radius:20px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,.15);
        }
        .header { display:flex; justify-content:space-between; align-items:center; background:#1565C0; color:#fff; padding:20px; }
        .header h2 { font-size:28px; }
        .header p { margin-top:8px; font-size:16px; font-weight:bold; }
        .timer { background:#fff; color:#d32f2f; padding:10px 18px; border-radius:30px; font-size:20px; font-weight:bold; }

        /* ==========================
           PROGRESS BAR
        ========================== */
        .progress { width:100%; height:10px; background:#ddd; }
        .progress-fill { width:0%; height:100%; background:#4CAF50; transition:.4s; }

        /* ==========================
           CONTROLS
        ========================== */
        .controls { display:flex; gap:15px; padding:20px; background:#F7F9FC; }
        .controls select { flex:1; padding:14px; border-radius:10px; border:1px solid #ccc; font-size:17px; }
        .btn-start { background:#28A745; color:#fff; border:none; border-radius:10px; padding:14px 28px; font-size:18px; cursor:pointer; }
        .btn-start:hover { background:#218838; }

        /* ==========================
           QUESTION & PALETTE
        ========================== */
        .question-number { text-align:center; font-size:22px; font-weight:bold; margin:20px; color:#1565C0; }
        .welcome-card { margin:25px; padding:35px; text-align:center; border-radius:15px; background:#E3F2FD; }
        .welcome-card h2 { color:#1565C0; margin-bottom:15px; }
        .question-block { background:#fff; margin:20px; padding:25px; border-radius:15px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
        .question { font-size:22px; font-weight:bold; margin-bottom:20px; }
        .options { list-style:none; }
        .options li { margin-bottom:12px; }
        .options label { display:block; padding:15px; background:#F8F9FA; border-radius:10px; cursor:pointer; border:1px solid #ddd; transition:.3s; }
        .options label:hover { background:#E3F2FD; border-color:#1565C0; }

        /* PALETTE CSS */
        .palette { display:none; flex-wrap:wrap; gap:8px; margin:20px; padding:15px; background:#F7F9FC; border-radius:10px; border:1px solid #ddd; max-height:200px; overflow-y:auto; }
        .palette-btn { width:38px; height:38px; border-radius:5px; border:1px solid #ccc; background:#fff; cursor:pointer; font-weight:bold; }
        .palette-btn.active { border:2px solid #000; transform:scale(1.1); }
        .palette-btn.attempted { background:#4CAF50; color:#fff; border-color:#388E3C; }
        .palette-btn.bookmarked { border: 2px solid #2196F3; }
        .palette-btn.review { background:#FFC107; color:#000; border-color:#FFA000; }

        /* ==========================
           ACTION BAR & NAVIGATION
        ========================== */
        .action-bar { display:none; justify-content:center; flex-wrap:wrap; gap:15px; margin:10px 20px; }
        .action-btn { padding:12px 18px; border-radius:8px; border:none; cursor:pointer; font-size:15px; background:#E3F2FD; color:#1565C0; font-weight:bold; transition:.3s;}
        .action-btn:hover { background:#BBDEFB; }

        .navigation { display:none; justify-content:space-between; margin:20px; gap: 15px;}
        .nav-button { flex:1; background:#1565C0; color:white; border:none; padding:15px; border-radius:10px; font-size:18px; cursor:pointer; transition:.3s;}
        .nav-button:hover { background:#0D47A1; }

        /* ==========================
           SUBMIT & RESULT
        ========================== */
        .btn-submit { display:none; width:calc(100% - 40px); margin:20px; padding:18px; background:#FF5722; color:#fff; border:none; border-radius:12px; font-size:20px; cursor:pointer; font-weight:bold;}
        .btn-submit:hover { background:#E64A19; }
        .result { margin:20px; padding:25px; background:#E8F5E9; border-radius:15px; text-align:center; font-size:22px; display:none; }

        /* ==========================
           MOBILE
        ========================== */
        @media(max-width:768px){
            .header { flex-direction:column; gap:15px; text-align:center; }
            .controls { flex-direction:column; }
            .header h2 { font-size:24px; }
            .question { font-size:18px; }
            .timer { font-size:18px; }
            .palette-btn { width: 32px; height: 32px; font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- Floating Buttons -->
<button class="back-btn" onclick="history.back()">←</button>
<button class="home-btn" onclick="window.location='file:///android_asset/home.html'">🏠</button>

<!-- Quiz Container -->
<div class="quiz-container">

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <h2>BPSC Practice Hub</h2>
            <p id="question-number-header">Welcome</p>
        </div>
        <div class="header-right">
            <div class="timer" id="timer">120:00</div>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- Controls -->
    <div class="controls" id="controls">
        <select id="set-selector">
            <option value="" disabled selected>Select Practice Set</option>
            <option value="set1">Practice Set 1</option>
            <option value="set2">Practice Set 2</option>
            <option value="set3">Practice Set 3</option>
            <option value="set4">Practice Set 4</option>
            <option value="set5">Practice Set 5</option>
            <option value="set6">Practice Set 6</option>
            <option value="set7">Practice Set 7</option>
            <option value="set8">Practice Set 8</option>
            <option value="set9">Practice Set 9</option>
            <option value="set10">Practice Set 10</option>
        </select>
        <button class="btn-start" onclick="startQuiz()">▶ Start Quiz</button>
    </div>

    <!-- Palette -->
    <div id="palette" class="palette"></div>

    <!-- Quiz Body -->
    <div id="quiz-body">
        <div class="welcome-card">
            <h2>Welcome to Preparation Adda</h2>
            <p>Select any Practice Set and press <b>Start Quiz</b> to begin.</p>
        </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar" id="action-bar">
        <button class="action-btn" onclick="bookmarkQuestion()">⭐ Bookmark</button>
        <button class="action-btn" onclick="reviewQuestion()">🟡 Review Later</button>
        <button class="action-btn" onclick="clearResponse()">❌ Clear</button>
    </div>

    <!-- Navigation -->
    <div class="navigation" id="navigation">
        <button class="nav-button" onclick="previousQuestion()">⬅ Previous</button>
        <button class="nav-button" onclick="nextQuestion()">Next ➜</button>
    </div>

    <!-- Submit Button -->
    <button class="btn-submit" id="submit-btn" onclick="submitQuiz()">Submit Quiz</button>

    <!-- Result Display -->
    <div class="result" id="result-display"></div>

</div>

    // ===============================
    // QUIZ VARIABLES
    // ===============================
    let currentQuestion = 0;
    let userAnswers = [];
    let bookmarked = [];
    let reviewLater = [];
    let currentSet = [];
    let timerInterval;
    let timeLeft = 120 * 60;

    // ===============================
    // START QUIZ
    // ===============================
    function startQuiz() {
        const selectedSetKey = document.getElementById("set-selector").value;

        if (!selectedSetKey) {
            alert("Please select a Practice Set first!");
            return;
        }

        currentSet = quizDatabase[selectedSetKey];

        if (!currentSet || currentSet.length === 0) {
            alert("Please paste your question database into the code first.");
            return;
        }

        // Reset variables
        currentQuestion = 0;
        userAnswers = [];
        bookmarked = [];
        reviewLater = [];
        timeLeft = 120 * 60;

        // UI Updates
        document.getElementById("controls").style.display = "none";
        document.getElementById("palette").style.display = "flex";
        document.getElementById("action-bar").style.display = "flex";
        document.getElementById("navigation").style.display = "flex";
        document.getElementById("submit-btn").style.display = "block";
        document.getElementById("submit-btn").disabled = false;
        document.getElementById("result-display").style.display = "none";

        // Initialize Quiz Mechanics
        clearInterval(timerInterval);
        startTimer();
        renderQuestions();
        updateQuestionCounter();
        updateProgressBar();
        createPalette();
    }

    // RENDER QUESTION
    // ===============================

        `;

            html += `
                <li>
                    <label>
                        <input type="radio" name="option" value="${index}" ${isChecked} onchange="saveAnswer(${index})">
                        ${opt}
                    </label>
                </li>
            `;
        });

        html += `</ul></div>`;
        quizBody.innerHTML = html;
    }

    // ===============================
    // TIMER
    // ===============================
    function startTimer() {
        updateTimer();
        timerInterval = setInterval(function () {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitQuiz();
                return;
            }
            timeLeft--;
            updateTimer();
        }, 1000);
    }

    function updateTimer() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById("timer").innerHTML =
            "⏰ " + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    }

    // ===============================
    // QUESTION COUNTER & PROGRESS
    // ===============================
    function updateQuestionCounter() {
        document.getElementById("question-number-header").innerHTML =
            "Question " + (currentQuestion + 1) + " / " + currentSet.length;
    }

    function updateProgressBar() {
        let percent = ((currentQuestion + 1) / currentSet.length) * 100;
        document.getElementById("progress-fill").style.width = percent + "%";
    }

    // ===============================
    // NAVIGATION
    // ===============================
    function nextQuestion() {
        if (currentQuestion < currentSet.length - 1) {
            currentQuestion++;
            renderQuestions();
            updateQuestionCounter();
            updateProgressBar();
            createPalette();
        }
    }

    function previousQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            renderQuestions();
            updateQuestionCounter();
            updateProgressBar();
            createPalette();
        }
    }

    function goToQuestion(index) {
        currentQuestion = index;
        renderQuestions();
        updateQuestionCounter();
        updateProgressBar();
        createPalette();
    }

    // ===============================
    // PALETTE & ACTIONS
    // ===============================
    function createPalette() {
        const palette = document.getElementById("palette");
        let html = "";

        currentSet.forEach((_, index) => {
            let statusClass = "";
            if (userAnswers[index] != null) statusClass += " attempted";
            if (bookmarked[index]) statusClass += " bookmarked";
            if (reviewLater[index]) statusClass += " review";

            const isActive = index === currentQuestion ? " active" : "";

            html += `<button class="palette-btn${statusClass}${isActive}" onclick="goToQuestion(${index})">${index + 1}</button>`;
        });

        palette.innerHTML = html;
    }

    function saveAnswer(answerIndex) {
        userAnswers[currentQuestion] = answerIndex;
        createPalette();
    }

    function bookmarkQuestion() {
        bookmarked[currentQuestion] = !bookmarked[currentQuestion];
        createPalette();
    }

    function reviewQuestion() {
        reviewLater[currentQuestion] = !reviewLater[currentQuestion];
        createPalette();
    }

    function clearResponse() {
        delete userAnswers[currentQuestion];
        renderQuestions();
        createPalette();
    }

    // ===============================
    // SUBMIT QUIZ
    // ===============================
    function submitQuiz() {
        clearInterval(timerInterval);

        let correct = 0;
        let wrong = 0;
        let skipped = 0;
        let score = 0;
        const marksPerQuestion = 3.14;

        currentSet.forEach((question, index) => {
            if (userAnswers[index] == null) {
                skipped++;
            } else if (userAnswers[index] == question.a) {
                correct++;
                score += marksPerQuestion;
            } else {
                wrong++;
                score -= (marksPerQuestion / 3);
            }
        });

        document.getElementById("submit-btn").disabled = true;
        document.getElementById("action-bar").style.display = "none";
        document.getElementById("navigation").style.display = "none";

        const accuracy = correct + wrong === 0
            ? 0
            : ((correct / (correct + wrong)) * 100).toFixed(2);

        document.getElementById("result-display").style.display = "block";
        document.getElementById("result-display").innerHTML = `
            <h2 style="color:#1565C0;">🎉 Quiz Completed</h2>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ccc;">
            <p><b>Total Questions :</b> ${currentSet.length}</p>
            <p style="color:green; margin-top: 10px;"><b>✅ Correct :</b> ${correct}</p>
            <p style="color:red; margin-top: 5px;"><b>❌ Wrong :</b> ${wrong}</p>
            <p style="color:gray; margin-top: 5px;"><b>⚪ Unattempted :</b> ${skipped}</p>
            <p style="margin-top: 10px;"><b>Accuracy :</b> ${accuracy}%</p>
            <h2 style="color:#0D47A1; margin-top: 15px;">Score : ${score.toFixed(2)}</h2>
        `;

        document.querySelectorAll("input[type='radio']").forEach(radio => radio.disabled = true);
        document.getElementById("result-display").scrollIntoView({ behavior: "smooth" });
    }
</script>
</body>
</html>
