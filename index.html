<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz Portal — Welcome</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/auth.js"></script>
    <style>
        :root{--overlay:rgba(2,6,23,0.36);--text:#f8fafc;--gold:#fbbf24}
        html,body{height:100%;margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial}
        body.splash{background-image:url('assets/images/login-bg.jpeg');background-size:cover;background-position:center center;background-repeat:no-repeat}
        .overlay{position:fixed;inset:0;background:var(--overlay);z-index:1}
        .splash-center{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--text);animation:fadeIn 700ms ease both}
        .brand-title{font-size:2.2rem;font-weight:800;letter-spacing:0.6px;margin-bottom:6px}
        .brand-sub{opacity:0.95;margin-bottom:6px}
        /* Quote card positioned lower-center to keep upper 40% unobstructed */
        .quote-card{position:fixed;left:50%;transform:translateX(-50%);bottom:6vh;z-index:2;width:min(92%,700px);padding:20px 28px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 18px 40px rgba(2,6,23,0.45);opacity:0;animation:fadeInUp 900ms 200ms ease forwards}
        .quote-inner{display:flex;gap:18px;align-items:flex-start}
        .qmark{font-family:Georgia,serif;color:var(--gold);font-size:48px;line-height:1}
        .quote-text{font-size:1.18rem;line-height:1.45;margin:0;color:#ffffff;font-family:Georgia,serif}
        .quote-author{margin-top:10px;color:var(--gold);font-weight:700}
        .countdown{margin-top:12px;font-weight:700;color:#e6eef8}
        .controls{margin-top:14px}
        .btn-skip{background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer}
        /* Premium logout button top-right */
        .btn-logout{position:fixed;top:18px;right:18px;z-index:3;background:rgba(12,12,12,0.36);border:2px solid var(--gold);color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(0,0,0,0.45);font-weight:700}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @media (max-width:900px){ .quote-card{width:min(92%,620px);padding:16px} .qmark{font-size:40px} .quote-text{font-size:1.05rem} }
        @media (max-width:640px){ .brand-title{font-size:1.4rem} .quote-card{width:min(94%,560px);padding:14px} .qmark{font-size:34px} .quote-text{font-size:1rem} }
    </style>
</head>
<body class="splash">
    <div class="overlay" aria-hidden="true"></div>
    <main class="splash-center" role="main">
        <div class="brand">
            <div class="brand-title">Quiz Portal</div>
            <div class="brand-sub">Designed &amp; Developed by Mayank</div>
        </div>

        <button id="logoutBtn" class="btn-logout" aria-label="Logout">Logout</button>

        <div class="quote-card" id="quoteCard" aria-live="polite">
            <div class="quote-inner">
                <div class="qmark">“</div>
                <div>
                    <p class="quote-text" id="quoteText">Loading…</p>
                    <div class="quote-author" id="quoteAuthor"></div>
                    <div class="countdown" id="countdown">Opening in 10...</div>
                    <div class="controls"><button id="skipBtn" class="btn-skip" type="button">Skip</button></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        (function(){
            const quotes = [
                "The only limit to our realization of tomorrow is our doubts of today. — Franklin D. Roosevelt",
                "Don’t watch the clock; do what it does. Keep going. — Sam Levenson",
                "The future belongs to those who believe in the beauty of their dreams. — Eleanor Roosevelt",
                "It always seems impossible until it’s done. — Nelson Mandela",
                "Start where you are. Use what you have. Do what you can. — Arthur Ashe",
                "You don’t have to be great to start, but you have to start to be great. — Zig Ziglar",
                "Success is not final, failure is not fatal: it is the courage to continue that counts. — Winston Churchill",
                "Believe you can and you’re halfway there. — Theodore Roosevelt",
                "Act as if what you do makes a difference. It does. — William James",
                "The secret of getting ahead is getting started. — Mark Twain",
                "Quality is not an act, it is a habit. — Aristotle",
                "Knowing is not enough; we must apply. Willing is not enough; we must do. — Goethe",
                "Small deeds done are better than great deeds planned. — Peter Marshall",
                "The expert in anything was once a beginner. — Helen Hayes",
                "Don’t limit your challenges. Challenge your limits. — Anonymous",
                "Dream big and dare to fail. — Norman Vaughan",
                "Do what you can, with what you have, where you are. — Theodore Roosevelt",
                "The way to get started is to quit talking and begin doing. — Walt Disney",
                "You miss 100% of the shots you don’t take. — Wayne Gretzky",
                "Keep your eyes on the stars, and your feet on the ground. — Theodore Roosevelt",
                "Hardships often prepare ordinary people for an extraordinary destiny. — C.S. Lewis",
                "The road to success and the road to failure are almost exactly the same. — Colin R. Davis",
                "Don’t be pushed around by the fears in your mind. Be led by the dreams in your heart. — Roy T. Bennett",
                "Opportunities don’t happen. You create them. — Chris Grosser",
                "Success usually comes to those who are too busy to be looking for it. — Henry David Thoreau",
                "The only way to do great work is to love what you do. — Steve Jobs",
                "In the middle of every difficulty lies opportunity. — Albert Einstein",
                "Perseverance is not a long race; it is many short races one after the other. — Walter Elliot",
                "The best time to plant a tree was 20 years ago. The second best time is now. — Chinese Proverb",
                "Your time is limited, so don’t waste it living someone else’s life. — Steve Jobs",
                "Courage does not always roar. Sometimes courage is the quiet voice at the end of the day saying, ‘I will try again tomorrow.’ — Mary Anne Radmacher"
            ];

            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            const countdownEl = document.getElementById('countdown');
            const skipBtn = document.getElementById('skipBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            // Pick a random quote once and keep it for the full countdown
            const idx = Math.floor(Math.random() * quotes.length);
            const chosen = quotes[idx];
            // Split author if exists (last dash separator)
            const parts = chosen.split('—');
            quoteText.textContent = parts[0].trim();
            quoteAuthor.textContent = parts[1] ? ('—' + parts[1].trim()) : '';

            let seconds = 10;
            countdownEl.textContent = `Opening in ${seconds}...`;

            const interval = setInterval(()=>{
                seconds -= 1;
                if(seconds > 0){
                    countdownEl.textContent = `Opening in ${seconds}...`;
                } else {
                    clearInterval(interval);
                    if (window.auth && window.auth.isEntryAuthenticated()) window.location.href = 'dashboard.html';
                }
            }, 1000);

            skipBtn.addEventListener('click', ()=>{
                clearInterval(interval);
                if (window.auth && window.auth.isEntryAuthenticated()) window.location.href = 'dashboard.html';
            });

            // Accessibility: allow Enter on Skip button
            skipBtn.addEventListener('keyup', (e)=>{ if(e.key === 'Enter') skipBtn.click(); });
            // Logout button relies on auth.js attachLogoutHandler; ensure it's visible and works
            if(logoutBtn){ logoutBtn.addEventListener('keyup', (e)=>{ if(e.key === 'Enter') logoutBtn.click(); }); }
        })();
    </script>
</body>
</html>
