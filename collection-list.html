<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection - Quiz Portal</title>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/quiz.css?v=collection-reader-selection-b-20261016" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <style>
        .collection-header {
            margin-bottom: 24px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 16px;
        }
        .collection-header h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .collection-header p {
            color: #6b7280;
            font-size: 0.95rem;
        }
        .collection-header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        #collectionReaderStorageStatus {
            min-height: 1.2em;
            overflow-wrap: anywhere;
        }
        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .collection-nav {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .collection-nav button {
            flex: 1;
        }
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #6b7280;
        }
        .collection-reader-question {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 0;
            align-items: start;
            padding: 20px 0;
            border-bottom: 1px solid #dbe3ee;
        }
        .collection-reader-question-content { min-width: 0; }
        .collection-reader-reveal {
            margin-top: 16px;
            padding: 16px;
            border: 1px solid #a7f3d0;
            border-radius: 10px;
            background: #f0fdf4;
        }
        .collection-reader-reveal[hidden] { display: none; }
        .collection-reader-answer { margin-bottom: 12px; }
        .collection-reader-source { margin: 12px 0; color: #64748b; font-size: 0.9rem; }
        .collection-reader-option {
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        .collection-reader-option .option-text { text-align: left; }
        .collection-reader-option:hover { border-color: #155eef; }
        .collection-reader-option.selected-option { outline: 2px solid #2563eb; }
        .collection-reader-option.correct-option { border-color: #16a34a; background: #dcfce7; }
        .collection-reader-option.incorrect-option { border-color: #dc2626; background: #fee2e2; }
        .question-media { margin: 14px 0; }
        .question-media img { display: block; max-height: 540px; object-fit: contain; }
        .question-media figcaption { margin-top: 6px; color: #64748b; }
        html[data-theme="dark"] .collection-reader-question { border-color: #475569; }
        html[data-theme="dark"] .collection-reader-reveal { background: #123126; border-color: #166534; color: #f8fafc; }
        html[data-theme="dark"] .collection-reader-source { color: #cbd5e1; }
        html[data-theme="dark"] .collection-reader-option.correct-option { background: #14532d; }
        html[data-theme="dark"] .collection-reader-option.incorrect-option { background: #7f1d1d; }
        @media (max-width: 640px) {
            .collection-reader-question { grid-template-columns: minmax(0, 1fr); }
            .collection-reader-question > .classification-question-checkbox { justify-self: start; }
        }
    </style>
    <script src="assets/js/collectionMigrationBackup.js?v=collection-migration-backup-v2"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</head>
<body>
    <header class="topbar">
        <div>
            <div class="topbar-kicker">Collection</div>
            <h1 id="pageTitle">Collection - Quiz Portal</h1>
            <div class="logo-badge">Quiz Portal</div>
            <div class="top-right">
                <button id="logoutBtn" class="btn-tertiary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="panel panel-light">
            <div class="collection-header">
                <h2 id="collectionTitle">Questions</h2>
                <p id="collectionSubtitle">Select an option to reveal its answer and explanation.</p>
                <div class="collection-header-actions">
                    <button type="button" class="btn btn-secondary btn-small" data-collection-export-all>Export Backup</button>
                </div>
            </div>
            <p id="collectionReaderStorageStatus" class="collection-storage-status" role="status" aria-live="polite"></p>
            <div id="classificationRemovalControls" class="classification-removal-controls" hidden></div>

            <div id="questionsList" class="questions-list"></div>

            <div class="collection-nav">
                <button id="backBtn" class="btn btn-secondary">⬅ Back</button>
            </div>
        </section>
    </main>

    <script src="assets/js/classificationRemoval.js?v=collection-reader-selection-20261016"></script>
    <script src="assets/js/explanationRenderer.js"></script>
    <script src="assets/js/questionRenderer.js?v=collections-20261016"></script>
    <script src="assets/js/collectionStore.js?v=collections-reader-c-20261016"></script>
    <script src="assets/js/collectionList.js?v=collection-reader-selection-b-20261016"></script>
</body>
</html>
